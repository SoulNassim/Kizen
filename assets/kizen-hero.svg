<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.18" />
      <stop offset="55%" stop-color="#09090b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#000000" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f4f5" />
      <stop offset="50%" stop-color="#a1a1aa" />
      <stop offset="100%" stop-color="#3f3f46" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0" />
      <stop offset="50%" stop-color="#fb7185" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#18181b" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="440" rx="24" fill="#000000" />
  <rect width="1200" height="440" rx="24" fill="url(#grid)" opacity="0.55" />
  <rect width="1200" height="440" rx="24" fill="url(#bgGlow)" />
  <rect x="1" y="1" width="1198" height="438" rx="23" fill="none" stroke="#27272a" stroke-width="2" />

  <!-- Top & Bottom Accent Filaments -->
  <rect x="200" y="1" width="800" height="2" fill="url(#roseGrad)" />
  <rect x="300" y="437" width="600" height="1.5" fill="url(#roseGrad)" opacity="0.5" />

  <!-- Forged HexCrest Emblem (Center-Top) -->
  <g transform="translate(600, 108)">
    <circle r="56" fill="none" stroke="#f43f5e" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="4 6" />
    <polygon points="0,-46 40,-23 40,23 0,46 -40,23 -40,-23" fill="#09090b" stroke="url(#rimGrad)" stroke-width="3" />
    <polygon points="0,-37 32,-18.5 32,18.5 0,37 -32,18.5 -32,-18.5" fill="#18181b" stroke="#fb7185" stroke-opacity="0.55" stroke-width="1.2" />
    <text x="0" y="8" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="900" letter-spacing="1">SSS</text>
  </g>

  <!-- Eyebrow -->
  <text x="600" y="196" text-anchor="middle" fill="#fb7185" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="800" letter-spacing="6">
    KIZEN · PROJECT ASCENSION
  </text>

  <!-- Main Headline -->
  <text x="600" y="252" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="48" font-weight="900" letter-spacing="-0.5">
    The All-In-One Personalized Gym System.
  </text>

  <!-- Subtitle -->
  <text x="600" y="292" text-anchor="middle" fill="#a1a1aa" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="500">
    Built for zero friction in the gym, deep biometric &amp; strength telemetry, and 100% customization.
  </text>

  <!-- 4 Telemetry Pills -->
  <g transform="translate(150, 336)">
    <rect x="0" y="0" width="210" height="52" rx="14" fill="#09090b" stroke="#27272a" stroke-width="1.5" />
    <text x="105" y="23" text-anchor="middle" fill="#71717a" font-family="ui-monospace, monospace" font-size="10" font-weight="800" letter-spacing="2">01 · IRON LOG</text>
    <text x="105" y="40" text-anchor="middle" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Custom Splits &amp; PR Forge</text>

    <rect x="230" y="0" width="210" height="52" rx="14" fill="#09090b" stroke="#27272a" stroke-width="1.5" />
    <text x="335" y="23" text-anchor="middle" fill="#71717a" font-family="ui-monospace, monospace" font-size="10" font-weight="800" letter-spacing="2">02 · AI NUTRITION</text>
    <text x="335" y="40" text-anchor="middle" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="13" font-weight="800">1-Tap Meal &amp; Macro Scan</text>

    <rect x="460" y="0" width="210" height="52" rx="14" fill="#09090b" stroke="#27272a" stroke-width="1.5" />
    <text x="565" y="23" text-anchor="middle" fill="#71717a" font-family="ui-monospace, monospace" font-size="10" font-weight="800" letter-spacing="2">03 · BIOMETRICS</text>
    <text x="565" y="40" text-anchor="middle" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="13" font-weight="800">3-Pose Physique Telemetry</text>

    <rect x="690" y="0" width="210" height="52" rx="14" fill="#09090b" stroke="#27272a" stroke-width="1.5" />
    <text x="795" y="23" text-anchor="middle" fill="#fb7185" font-family="ui-monospace, monospace" font-size="10" font-weight="800" letter-spacing="2">04 · RANKED ELO</text>
    <text x="795" y="40" text-anchor="middle" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Kato AI &amp; 14-Day Verdicts</text>
  </g>
</svg>
