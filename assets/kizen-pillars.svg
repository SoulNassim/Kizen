    <text x="20" y="102" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="12">lift ratios, and 6-axis body scans.</text>
    <!-- Telemetry Bars -->
    <g transform="translate(20, 130)">
      <text x="0" y="12" fill="#d4d4d8" font-family="ui-monospace, monospace" font-size="10" font-weight="700">CHEST</text>
      <rect x="68" y="4" width="125" height="6" rx="3" fill="#18181b" />
      <rect x="68" y="4" width="112" height="6" rx="3" fill="#fb7185" />
      <text x="230" y="12" text-anchor="end" fill="#ffffff" font-family="ui-monospace, monospace" font-size="11" font-weight="800">92 S</text>

      <text x="0" y="40" fill="#d4d4d8" font-family="ui-monospace, monospace" font-size="10" font-weight="700">BACK</text>
      <rect x="68" y="32" width="125" height="6" rx="3" fill="#18181b" />
      <rect x="68" y="32" width="104" height="6" rx="3" fill="#e4e4e7" />
      <text x="230" y="40" text-anchor="end" fill="#ffffff" font-family="ui-monospace, monospace" font-size="11" font-weight="800">86 A</text>

      <text x="0" y="68" fill="#d4d4d8" font-family="ui-monospace, monospace" font-size="10" font-weight="700">SHOULDERS</text>
      <rect x="68" y="60" width="125" height="6" rx="3" fill="#18181b" />
      <rect x="68" y="60" width="115" height="6" rx="3" fill="#fb7185" />
      <text x="230" y="68" text-anchor="end" fill="#ffffff" font-family="ui-monospace, monospace" font-size="11" font-weight="800">94 S</text>

      <text x="0" y="96" fill="#d4d4d8" font-family="ui-monospace, monospace" font-size="10" font-weight="700">LEGS</text>
      <rect x="68" y="88" width="125" height="6" rx="3" fill="#18181b" />
      <rect x="68" y="88" width="98" height="6" rx="3" fill="#e4e4e7" />
      <text x="230" y="96" text-anchor="end" fill="#ffffff" font-family="ui-monospace, monospace" font-size="11" font-weight="800">82 A</text>
    </g>
  </g>

  <!-- Card 4: Kato & Verdicts -->
  <g transform="translate(906, 24)">
    <rect width="270" height="272" rx="16" fill="#09090b" stroke="#27272a" stroke-width="1.2" />
    <text x="20" y="34" fill="#fb7185" font-family="ui-monospace, monospace" font-size="10" font-weight="800" letter-spacing="2">KATO · THE IRON</text>
    <text x="20" y="60" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="900">14-Day Ranked Verdicts</text>
    <text x="20" y="84" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="12">One relentless AI coach with full</text>
    <text x="20" y="102" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="12">context of your lifts, scans &amp; diet.</text>
    <rect x="20" y="128" width="230" height="124" rx="12" fill="#050507" stroke="#27272a" />
    <text x="36" y="156" fill="#71717a" font-family="ui-monospace, monospace" font-size="10" font-weight="800">CYCLE VERDICT LOCKED</text>
    <text x="36" y="198" fill="#ffffff" font-family="system-ui, sans-serif" font-size="40" font-weight="900">1,192</text>
    <rect x="164" y="172" width="68" height="26" rx="6" fill="#18181b" stroke="#52525b" />
    <text x="198" y="189" text-anchor="middle" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11" font-weight="900">SS TIER</text>
    <text x="36" y="232" fill="#fb7185" font-family="ui-monospace, monospace" font-size="11" font-weight="800">+48 ELO vs PREVIOUS CYCLE</text>
  </g>
